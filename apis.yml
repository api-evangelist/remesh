name: Remesh
description: Remesh is an AI-powered market research and audience insights platform that runs live,
  asynchronous, and video conversations with customers or employees at scale, using machine learning to
  cluster, rank, and surface representative opinions from large groups in real time. Its products span
  live AI-moderated focus groups, employee listening, and healthcare research, with an embedded research
  assistant (Remy). Remesh is delivered as a hosted SaaS workspace at live.remesh.chat; it publishes no
  public developer API, SDKs, or OpenAPI surface as of this profile. This record was surfaced as a
  portfolio company of General Catalyst and Techstars and enriched with the provider's real published
  identity, security, and trust artifacts.
